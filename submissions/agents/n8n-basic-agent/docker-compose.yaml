version: "3.8"

services:

  db:
    # pg16 + pgvector baked in (no manual build steps)
    image: pgvector/pgvector:0.8.0-pg17
    container_name: n8n_db
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: supersecret
      POSTGRES_DB: n8n
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # one-time init script that creates the extension in the n8n database
      # - ./init-pgvector.sql:/docker-entrypoint-initdb.d/10_pgvector.sql

  n8n:
    image: docker.n8n.io/n8nio/n8n:1.93.0   # stick to a fixed tag for stability
    container_name: n8n
    restart: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5678:5678"      # <hostPort>:<containerPort>
    environment:
      # --- database connection ---
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: db
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: supersecret
      # --- core settings ---
      GENERIC_TIMEZONE: America/Toronto      # pick yours
      N8N_HOST: localhost                    # change if reverse-proxying
      N8N_PORT: 5678
      WEBHOOK_URL: http://localhost:5678/    # external URL that webhooks should call
      # N8N_ENCRYPTION_KEY: "32_random_characters"   # uncomment in prod
      # N8N_BASIC_AUTH_USER: alex             # optional built-in auth
      # N8N_BASIC_AUTH_PASSWORD: changeme
      # --- logging settings ---
      N8N_LOG_LEVEL: debug                   # debug, info, warn, error
      N8N_LOG_OUTPUT: console                   # console, file, both
      N8N_LOG_FILE_LOCATION: /home/node/.n8n/logs/
      N8N_LOG_FILE_COUNT_MAX: 100
      N8N_LOG_FILE_SIZE_MAX: 16             # MB
      # --- API keys ---
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    volumes:
      - n8n_data:/home/node/.n8n             # persistent creds/workflows
      - ./files:/files
      - ./logs:/home/node/.n8n/logs          # map logs to host directory
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  postgres_data:
  n8n_data:
